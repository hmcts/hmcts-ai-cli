name: Release

on:
  push:
    branches: [master]

# Never cancel a release in progress: two overlapping publishes would race on the version
# number and one of them would publish a version that is already taken.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # No id-token: npm provenance is npmjs.org-only and Azure Artifacts does not support it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install
        run: yarn install --immutable

      # CI runs on pull requests only, so without these a direct push to master would publish
      # whatever it was given.
      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:coverage

      - name: Build
        run: yarn build

      - name: Bump the patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      # Kept line-for-line from cnp-githubactions-library/npm-publish-library so that moving
      # to the shared action later is a straight substitution.
      - name: Configure npm authentication for Azure Artifacts
        env:
          AZURE_DEVOPS_ARTIFACT_USERNAME: ${{ secrets.AZURE_DEVOPS_ARTIFACT_USERNAME }}
          AZURE_DEVOPS_ARTIFACT_TOKEN: ${{ secrets.AZURE_DEVOPS_ARTIFACT_TOKEN }}
          FEED_URL: https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/npm/registry/
          NPM_SCOPE: '@hmcts-cft'
        run: |
          token_b64="$(printf %s "$AZURE_DEVOPS_ARTIFACT_TOKEN" | base64 | tr -d '\n')"
          username="${AZURE_DEVOPS_ARTIFACT_USERNAME:-github}"
          feed="${FEED_URL%/}/"
          # Strip the scheme to build the npm-style "//host/path/" auth keys.
          feed_no_scheme="${feed#https:}"
          cat > "$HOME/.npmrc" <<EOF
          registry=${feed}
          always-auth=true
          ${feed_no_scheme}:username=${username}
          ${feed_no_scheme}:_password=${token_b64}
          ${feed_no_scheme}:email=github-actions@hmcts.net
          EOF
          # Defend against publishConfig.registry going missing — npm prefers @<scope>:registry
          # over the default `registry=` line.
          echo "@${NPM_SCOPE#@}:registry=${feed}" >> "$HOME/.npmrc"

      - name: Publish
        run: npm publish

      # Publish first: a tag with no package behind it is a cosmetic gap, since the next run
      # bumps past it. The opposite — a published version master does not know about — is not
      # recoverable on its own: every later run bumps to that same number and npm answers 403
      # "the feed already contains" for good. That is what happened to 0.0.14, so the push
      # below has to survive a merge landing while the gates ran.
      - name: Commit the bump and tag the release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json
          # This cannot loop: pushes made with GITHUB_TOKEN do not trigger workflows.
          git commit -m "chore: release v${VERSION} [skip ci]"
          # Said from more than one place below, and it is the only record of the way out.
          UNRECORDED="published v${VERSION} but could not record the bump on ${GITHUB_REF_NAME}. Set version to ${VERSION} in package.json by hand, or the next release will retry a version the feed already has."
          # The commit that was gated and packed, pinned before the loop below can rebase it onto
          # a merge that landed meanwhile. The tag is made from this rather than from whatever
          # ends up on the branch, so `git checkout v<version>` gives you what the feed has — the
          # object survives the rebase because `actions/checkout` sets `gc.auto 0`.
          published="$(git rev-parse HEAD)"
          # A merge during the gates leaves this push non-fast-forward. Rebase onto it and try
          # again: the commit touches package.json alone, and the concurrency group means no
          # other release can be moving that file underneath us.
          for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                  break
              fi
              if [ "$attempt" = 3 ]; then
                  echo "::error::${UNRECORDED}" >&2
                  exit 1
              fi
              # Both of these can fail under `-e` — a conflicting rebase most plausibly, since a
              # merge editing the top of package.json lands within the default merge context of
              # the version line. Without catching them the step dies before the message above,
              # which is the only place the way out is written down.
              git fetch origin "${GITHUB_REF_NAME}" || true
              git rebase "origin/${GITHUB_REF_NAME}" || {
                  echo "::error::${UNRECORDED}" >&2
                  exit 1
              }
          done
          # Last, so that a transient failure tagging cannot stop the bump being recorded. Those
          # two failures are not equals: a tag the next run can add is a gap, a published version
          # master does not know about is permanent, because every later run bumps to that same
          # number and npm answers 403 for good. That is what happened to 0.0.14.
          git push origin "${published}:refs/tags/v${VERSION}" ||
              echo "::warning::published v${VERSION} and recorded the bump, but could not tag ${published}. Tag it by hand; nothing reads the tags, so no release is blocked."
